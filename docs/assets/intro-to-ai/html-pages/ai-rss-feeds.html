<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intro to AI - Live RSS Feeds</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #4f46e5;
            --border: #e5e7eb;
            --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(120deg, #4f46e5, #06b6d4);
            color: #fff;
            padding: 32px 24px;
        }
        header .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
        }
        header p {
            margin: 0;
            opacity: 0.9;
        }
        main {
            max-width: 1200px;
            margin: 24px auto 48px;
            padding: 0 24px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .status {
            color: var(--muted);
            font-size: 0.95rem;
        }
        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .feed-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 18px 18px 12px;
            display: flex;
            flex-direction: column;
            min-height: 260px;
        }
        .feed-card h2 {
            font-size: 1.1rem;
            margin: 0 0 8px 0;
        }
        .feed-card a.source {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .feed-card ul {
            list-style: none;
            padding: 0;
            margin: 12px 0 0 0;
        }
        .feed-card li {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border);
        }
        .feed-card li:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .feed-card .item-title {
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
        }
        .feed-card .meta {
            font-size: 0.85rem;
            color: var(--muted);
        }
        .feed-card .error {
            color: #b91c1c;
            font-size: 0.9rem;
        }
        .loading {
            color: var(--muted);
            font-style: italic;
        }
        .note {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            color: #92400e;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Intro to AI — Live RSS Feeds</h1>
            <p>Auto-refreshes every 10 minutes to surface new AI news and research.</p>
        </div>
    </header>

    <main>
        <div class="note">
            Some sites may block cross-site requests. If a feed fails to load, click its source link to view it directly.
        </div>

        <div class="toolbar">
            <div class="status" id="status">Last updated: —</div>
            <button id="refreshButton" type="button">Refresh now</button>
        </div>

        <div class="feed-grid" id="feedGrid">
            <div class="feed-card"><p class="loading">Loading feeds…</p></div>
        </div>
    </main>

    <script>
        const feeds = [
            { name: "404 Media", url: "https://www.404media.co/rss" },
            { name: "Ahead of AI", url: "https://magazine.sebastianraschka.com/feed" },
            { name: "AI Accelerator Institute | Future of Artificial Intelligence", url: "https://aiacceleratorinstitute.com/rss/" },
            { name: "AI – AI-TechPark", url: "https://ai-techpark.com/category/ai/feed/" },
            { name: "AI Archives | KnowTechie", url: "https://knowtechie.com/category/ai/feed/" },
            { name: "AI Business", url: "https://aibusiness.com/rss.xml" },
            { name: "AIModels.fyi", url: "https://aimodels.substack.com/feed" },
            { name: "AI News", url: "https://www.artificialintelligence-news.com/feed/rss/" },
            { name: "AI News | VentureBeat", url: "https://venturebeat.com/category/ai/feed/" },
            { name: "AI Now Institute", url: "https://ainowinstitute.org/category/news/feed" },
            { name: "Ai Prompt Programming", url: "https://www.reddit.com/r/aipromptprogramming/.rss" },
            { name: "AI – SiliconANGLE", url: "https://siliconangle.com/category/ai/feed" },
            { name: "AI Snake Oil", url: "https://aisnakeoil.substack.com/feed" },
            { name: "AI – Uber Engineering Blog", url: "https://eng.uber.com/category/articles/ai/feed" },
            { name: "Anaconda Blog", url: "https://www.anaconda.com/blog/feed" },
            { name: "Analytics India Magazine", url: "https://analyticsindiamag.com/feed/" },
            { name: "Announcements - Stability AI", url: "https://stability.ai/blog?format=rss" },
            { name: "Ars Technica - All content", url: "https://feeds.arstechnica.com/arstechnica/index" },
            { name: "Artificial Intelligence", url: "https://www.reddit.com/r/artificial/.rss" },
            { name: "Artificial intelligence (AI) – The Conversation", url: "https://theconversation.com/europe/topics/artificial-intelligence-ai-90/articles.atom" },
            { name: "Artificial intelligence (AI) | The Guardian", url: "https://www.theguardian.com/technology/artificialintelligenceai/rss" },
            { name: "artificial intelligence Archives - SpaceNews", url: "https://spacenews.com/tag/artificial-intelligence/feed/" },
            { name: "Artificial Intelligence – Futurism", url: "https://futurism.com/categories/ai-artificial-intelligence/feed" },
            { name: "Artificial Intelligence Latest - Wired", url: "https://www.wired.com/feed/tag/ai/latest/rss" },
            { name: "Artificial Intelligence News -- ScienceDaily", url: "https://www.sciencedaily.com/rss/computers_math/artificial_intelligence.xml" }
        ];

        const maxItems = 5;
        const refreshIntervalMs = 10 * 60 * 1000;
        const feedGrid = document.getElementById("feedGrid");
        const statusEl = document.getElementById("status");
        const refreshButton = document.getElementById("refreshButton");

        const proxyUrl = (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;

        const parseFeed = (xmlText) => {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, "application/xml");
            if (xml.querySelector("parsererror")) {
                throw new Error("Invalid XML");
            }
            const items = Array.from(xml.querySelectorAll("item"));
            if (items.length) {
                return items.map(item => ({
                    title: item.querySelector("title")?.textContent?.trim() || "Untitled",
                    link: item.querySelector("link")?.textContent?.trim() || "#",
                    date: item.querySelector("pubDate")?.textContent?.trim() || ""
                }));
            }
            const entries = Array.from(xml.querySelectorAll("entry"));
            return entries.map(entry => {
                const linkEl = entry.querySelector("link[rel='alternate']") || entry.querySelector("link");
                return {
                    title: entry.querySelector("title")?.textContent?.trim() || "Untitled",
                    link: linkEl?.getAttribute("href") || linkEl?.textContent?.trim() || "#",
                    date: entry.querySelector("updated")?.textContent?.trim() || entry.querySelector("published")?.textContent?.trim() || ""
                };
            });
        };

        const renderFeed = (feed, items, error) => {
            const card = document.createElement("div");
            card.className = "feed-card";
            const title = document.createElement("h2");
            title.textContent = feed.name;

            const source = document.createElement("a");
            source.className = "source";
            source.href = feed.url;
            source.target = "_blank";
            source.rel = "noopener noreferrer";
            source.textContent = "View source";

            card.appendChild(title);
            card.appendChild(source);

            if (error) {
                const errorEl = document.createElement("p");
                errorEl.className = "error";
                errorEl.textContent = "Unable to load this feed.";
                card.appendChild(errorEl);
                return card;
            }

            const list = document.createElement("ul");
            items.slice(0, maxItems).forEach(item => {
                const li = document.createElement("li");
                const link = document.createElement("a");
                link.className = "item-title";
                link.href = item.link;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = item.title;

                const meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = item.date ? new Date(item.date).toLocaleString() : "";

                li.appendChild(link);
                if (meta.textContent) {
                    li.appendChild(meta);
                }
                list.appendChild(li);
            });

            card.appendChild(list);
            return card;
        };

        const loadFeeds = async () => {
            refreshButton.disabled = true;
            feedGrid.innerHTML = "";

            const results = await Promise.all(feeds.map(async feed => {
                try {
                    const response = await fetch(proxyUrl(feed.url), { cache: "no-store" });
                    if (!response.ok) {
                        throw new Error("Network error");
                    }
                    const text = await response.text();
                    const items = parseFeed(text);
                    return { feed, items, error: null };
                } catch (error) {
                    return { feed, items: [], error };
                }
            }));

            results.forEach(result => {
                feedGrid.appendChild(renderFeed(result.feed, result.items, result.error));
            });

            statusEl.textContent = `Last updated: ${new Date().toLocaleString()}`;
            refreshButton.disabled = false;
        };

        refreshButton.addEventListener("click", loadFeeds);
        loadFeeds();
        setInterval(loadFeeds, refreshIntervalMs);
    </script>
</body>
</html>
