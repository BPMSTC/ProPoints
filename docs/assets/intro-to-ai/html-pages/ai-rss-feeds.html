<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intro to AI - Live RSS Feeds</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #4f46e5;
            --border: #e5e7eb;
            --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(120deg, #4f46e5, #06b6d4);
            color: #fff;
            padding: 32px 24px;
        }
        header .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
        }
        header p {
            margin: 0;
            opacity: 0.9;
        }
        main {
            max-width: 1200px;
            margin: 24px auto 48px;
            padding: 0 24px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .status {
            color: var(--muted);
            font-size: 0.95rem;
        }
        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .feed-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 18px 18px 12px;
            display: flex;
            flex-direction: column;
            min-height: 260px;
        }
        .feed-card h2 {
            font-size: 1.1rem;
            margin: 0 0 8px 0;
        }
        .feed-card a.source {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .feed-card ul {
            list-style: none;
            padding: 0;
            margin: 12px 0 0 0;
        }
        .feed-card li {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border);
        }
        .feed-card li:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .feed-card .item-title {
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
        }
        .feed-card .meta {
            font-size: 0.85rem;
            color: var(--muted);
        }
        .feed-card .error {
            color: #b91c1c;
            font-size: 0.9rem;
        }
        .loading {
            color: var(--muted);
            font-style: italic;
        }
        .note {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            color: #92400e;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Intro to AI — Live RSS Feeds</h1>
            <p>Auto-refreshes every 10 minutes to surface new AI news and research.</p>
        </div>
    </header>

    <main>
        <div class="note">
            This page loads a server-generated snapshot that refreshes about once an hour. If a feed fails, use the source link.
        </div>

        <div class="toolbar">
            <div class="status" id="status">Last updated: —</div>
            <button id="refreshButton" type="button">Refresh now</button>
        </div>

        <div class="feed-grid" id="feedGrid">
            <div class="feed-card"><p class="loading">Loading feeds…</p></div>
        </div>
    </main>

    <script>
        const refreshIntervalMs = 10 * 60 * 1000;
        const feedGrid = document.getElementById("feedGrid");
        const statusEl = document.getElementById("status");
        const refreshButton = document.getElementById("refreshButton");

        const dataUrl = new URL("../data/feeds.json", window.location.href);

        const renderFeed = (feed) => {
            const card = document.createElement("div");
            card.className = "feed-card";
            const title = document.createElement("h2");
            title.textContent = feed.name;

            const source = document.createElement("a");
            source.className = "source";
            source.href = feed.url;
            source.target = "_blank";
            source.rel = "noopener noreferrer";
            source.textContent = "View source";

            card.appendChild(title);
            card.appendChild(source);

            if (feed.error) {
                const errorEl = document.createElement("p");
                errorEl.className = "error";
                errorEl.textContent = "Unable to load this feed.";
                card.appendChild(errorEl);
                return card;
            }

            const list = document.createElement("ul");
            (feed.items || []).forEach(item => {
                const li = document.createElement("li");
                const link = document.createElement("a");
                link.className = "item-title";
                link.href = item.link;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = item.title;

                const meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = item.date ? new Date(item.date).toLocaleString() : "";

                li.appendChild(link);
                if (meta.textContent) {
                    li.appendChild(meta);
                }
                list.appendChild(li);
            });

            card.appendChild(list);
            return card;
        };

        const loadFeeds = async () => {
            refreshButton.disabled = true;
            feedGrid.innerHTML = "";

            try {
                const response = await fetch(`${dataUrl.toString()}?t=${Date.now()}`, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error("Network error");
                }
                const payload = await response.json();
                (payload.feeds || []).forEach(feed => {
                    feedGrid.appendChild(renderFeed(feed));
                });
                if (!payload.feeds || payload.feeds.length === 0) {
                    feedGrid.innerHTML = "<div class=\"feed-card\"><p class=\"error\">No feeds found.</p></div>";
                }
                const lastUpdated = payload.generatedAt ? new Date(payload.generatedAt).toLocaleString() : "—";
                statusEl.textContent = `Last updated: ${lastUpdated}`;
            } catch (error) {
                feedGrid.innerHTML = "<div class=\"feed-card\"><p class=\"error\">Unable to load feed snapshot.</p></div>";
                statusEl.textContent = "Last updated: —";
            } finally {
                refreshButton.disabled = false;
            }
        };

        refreshButton.addEventListener("click", loadFeeds);
        loadFeeds();
        setInterval(loadFeeds, refreshIntervalMs);
    </script>
</body>
</html>
